services:
  # База данных: PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: beeline_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Бэкенд: FastAPI + PostgreSQL + встроенный VRPTW Solver & XAI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beeline_scheduler_backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-scheduler_db}
    depends_on:
      - db
    restart: unless-stopped

  # Клиентский интерфейс диспетчера (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beeline_scheduler_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
