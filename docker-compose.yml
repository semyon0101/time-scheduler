services:
  # База данных: PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: beeline_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Бэкенд: FastAPI + PostgreSQL + встроенный VRPTW Solver & XAI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beeline_scheduler_backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - RESPONSE_LIMIT_MIN=${RESPONSE_LIMIT_MIN:-120}
      - RESPONSE_TARGET_MIN=${RESPONSE_TARGET_MIN:-60}
    depends_on:
      - db
    restart: unless-stopped

  # Клиентский интерфейс диспетчера (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beeline_scheduler_frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT}
      - VITE_PROXY_TARGET=http://backend:${BACKEND_PORT}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
